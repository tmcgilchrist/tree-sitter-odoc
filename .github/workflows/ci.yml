name: CI

on:
  push:
    branches: [main, master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test Parser
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Run parser tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: ${{runner.os == 'Linux'}}
          test-node: true
          test-python: false
          test-go: true
          test-swift: false
          # Node 20 bundles npm 10 / node-gyp 10, which does not recognise
          # Visual Studio 2026 and so cannot build the node binding on the
          # windows-2025-vs2026 runner.  Node 24 bundles npm 11.19 with
          # node-gyp >= 12.1, which knows VS major version 18.  Node >= 22
          # headers also require C++20, which needs tree-sitter >= 0.25.1 —
          # 0.25.0's binding.gyp hardcodes C++17.
          node-version: '24'
          abi-version: 14

  parse-examples:
    name: Parse Examples
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Parse example files
        uses: tree-sitter/parse-action@v4
        with:
          files: test/files.txt

  check-queries:
    name: Check Queries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Test highlight queries
        run: tree-sitter highlight queries/highlights.scm --check

      - name: Test injection queries
        run: tree-sitter highlight queries/injections.scm --check || true
